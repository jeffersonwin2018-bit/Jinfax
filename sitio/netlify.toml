[build]
  publish = "."
  functions = "netlify/functions"

# Fuentes y módulos con hash: caché de 1 año
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/js/c/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
# Imágenes: 1 semana (si reemplazas una foto con el mismo nombre, se actualiza en máx. 7 días; mejor usa nombres nuevos)
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/assets/inspiracion/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/assets/memes/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# No servir el código de las funciones como archivo estático
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true
